<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TMA · Trek Management App</title>
  <meta name="description" content="Book, lead and manage Himalayan treks.">
  <meta name="theme-color" content="#26372e">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/img/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2326372e'/%3E%3Cpath d='M5 25 L13 11 L17 17 L20 13 L27 25 Z' fill='%23a0c3be'/%3E%3Cpath d='M13 11 L11 15 L15 15 Z' fill='%23e7e9db'/%3E%3Ccircle cx='24' cy='8' r='3' fill='%23f28c28'/%3E%3C/svg%3E">

  <!-- Login intro: start downloading the video and its end frame immediately -->
  <link rel="preload" as="video" href="/static/media/login-bg.mp4" type="video/mp4">
  <link rel="preload" as="image" href="/static/img/login-bg-end.jpg">

  <!-- Fonts: Fredoka (rounded display) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">

  <!-- Bootstrap 5 + Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Our styles (order matters: tokens first, then page styles) -->
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="/static/css/style.css">

  <!-- Import map: lets our ES modules write `import { ref } from 'vue'` without a build step -->
  <script type="importmap">
  {
    "imports": {
      "vue": "https://unpkg.com/vue@3.5.13/dist/vue.esm-browser.prod.js",
      "vue-router": "https://unpkg.com/vue-router@4.5.0/dist/vue-router.esm-browser.prod.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>TMA needs JavaScript enabled to run.</noscript>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="/static/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js').catch(function () {});
        // Tell the worker what this first load fetched, so it's cached straight away.
        navigator.serviceWorker.ready.then(function (registration) {
          var urls = performance.getEntriesByType('resource').map(function (entry) { return entry.name; });
          registration.active.postMessage({ type: 'CACHE_URLS', urls: urls });
        });
      });
    }
  </script>
</body>
</html>
